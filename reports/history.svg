  .note { fill: #52514e; }
  .tick { fill: #898781; font-variant-numeric: tabular-nums; }
  .value { fill: #0b0b0b; font-variant-numeric: tabular-nums; }
  .change { fill: #52514e; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
