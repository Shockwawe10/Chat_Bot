[pytest]
testpaths = tests
pythonpath = . tests/unit
addopts = -m "not real and not nightly and not e2e"
markers =
    real: needs Ollama and the real models (run with: pytest -m real)
    nightly: the full nightly runs are fresh; CI reports it as a warning (run with: pytest -m nightly)
    e2e: browser tests of the chat window against the stand-in API (run with: make e2e)
