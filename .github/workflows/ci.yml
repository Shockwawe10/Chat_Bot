name: CI

# Every push runs this, so each commit in a pull request gets checked.
on: push

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: make lint PYTHON=python
      - run: make test PYTHON=python
      # The full dev and attack runs come from make nightly. A stale one is a warning, not a
      # failure: the smoke run, checked in make test, is what every change must refresh.
      - name: Nightly runs are fresh (warning only)
        continue-on-error: true
        run: python -m pytest -m nightly
